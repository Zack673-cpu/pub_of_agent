<!doctype html>
<html lang="zh">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>出版社智能体问答</title>
		<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
	</head>
	<body>
		<div id="app">
			<input type="text" 
				v-model="question"
				placeholder="请输入你的问题："
			/>
			
			<button @click="ask">点击发送</button>
			<p><strong>答案会显示在这里</strong>{{answer}}</p>

			<hr />
			<h3>生成初稿</h3>
			<!-- 输入题目生成大纲 -->
			<input v-model="topic" placeholder="输入教材题目">
			<button @click="getOutline">生成大纲</button>
			<pre>{{outline}}</pre>
			<!-- 输入选定节，生成初稿 -->
			<input v-model="section" placeholder="输入要写的一节">
			<button @click="getDraft">生成初稿</button>
			<pre>{{draft}}</pre>

		</div>
	</body>

	<script>
		const {createApp}=Vue;

		createApp({
			data(){
				return{
					question:"",
					answer:"",
					topic:"",
					outline:"",
					section:"",
					draft:""
				};
			},
			methods:{
				async ask(){
					if(!this.question.trim()){
						alert("请输入问题！");
						return;
					}

					const url="/ask";
					const headers={
						"Authorization":"123456",
						"Content-Type":"application/json",
					}
					const body={
						Question:this.question,
					}

					try {
						const response=await fetch(url,{
							method:"POST",
							headers:headers,
							body:JSON.stringify(body),

						})

						if(!response.ok){
							const error_data=await response.json();
							throw new Error(error_data.detail||"请求失败");
						}
						
						const data=await response.json();
						this.answer=data["智能体回答："]||JSON.stringify(data)


					} catch (error) {
						console.error("请求出错",error);
						this.answer="出错了";
					}

				},
				async getOutline(){
					if(!this.topic.trim()){
						alert("请输入题目！")
						return;
					}

					const url="/outline";
					const headers={
						"Authorization":"123456",
						"Content-Type":"application/json",
					}
					const body={
						Topic:this.topic,
					}
					try {
						const response=await fetch(url,{
							method: "POST",
							headers:headers,
							body:JSON.stringify(body)
						})

						if (!response.ok){
							const error_data=await response.json();
							throw new Error(error_data.detail||"	请求出错！")
						}

						const data=await response.json();
						this.outline=data["大纲："]||JSON.stringify(data);

					} catch (error) {
						console.error("请求出错",error);
						this.outline="出错了";
					}	

				},
				async getDraft(){
					if (!this.section.trim()){
						alert("请输入要选定的那节");
						return ;
					}

					const url="/generate";
					const headers={
						"Authorization":"123456",
						"Content-Type":"application/json",
					}
					const body={
						Section:this.section
					}

					try {
						const response=await fetch(url,{
							method:"POST",
							headers:headers,
							body:JSON.stringify(body)
						})

						if (!response.ok){
							const error_data=await response.json();
							throw new Error(error_data.detail||"	请求出错！");
						}
						const data =await response.json();
						this.draft=data["初稿："]||JSON.stringify(data)

					} catch (error) {
						console.error("	出错了",error)
						this.draft="出错了";
					}
				},
			},


		}).mount("#app")

	</script>
</html>
